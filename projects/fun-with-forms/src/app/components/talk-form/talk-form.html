<form>
  <h1>Call for Papers</h1>

  <section>
    <h2>Your talk</h2>

    <app-field label="Title">
      <input type="text" [formField]="f.title" />
    </app-field>

    <app-field label="Abstract">
      <textarea rows="6" [formField]="f.abstract"></textarea>
    </app-field>

    <app-field label="Expertise level">
      <input type="number" [formField]="f.expertise" />
    </app-field>
  </section>

  <section class="theme-2">
    <h2>Speaker</h2>

    <app-field label="First name">
      <input type="text" [formField]="f.speaker.firstName" />
    </app-field>

    <app-field label="Last name">
      <input type="text" [formField]="f.speaker.lastName" />
    </app-field>

    <app-field label="Email">
      <input type="email" [formField]="f.speaker.email" />
    </app-field>

    <app-field label="Bio">
      <textarea rows="4" [formField]="f.speaker.bio"></textarea>
    </app-field>
  </section>

  <section class="theme-3">
    <div class="section-header">
      <h2>Co-speakers</h2>
      <button
        type="button"
        class="icon-btn"
        (click)="addCoSpeaker()"
        aria-label="Add co-speaker"
        title="Add co-speaker"
      >
        ＋
      </button>
    </div>

    @for (coSpeaker of f.coSpeakers; track coSpeaker; let i = $index) {
      <fieldset>
        <legend>Co-speaker {{ i + 1 }}</legend>
        <button
          type="button"
          class="icon-btn danger remove-co-speaker"
          (click)="removeCoSpeaker(i)"
          aria-label="Remove co-speaker"
          title="Remove co-speaker"
        >
          🗑&#xFE0E;
        </button>

        <app-field label="First name">
          <input type="text" [formField]="coSpeaker.firstName" />
        </app-field>

        <app-field label="Last name">
          <input type="text" [formField]="coSpeaker.lastName" />
        </app-field>

        <app-field label="Email">
          <input type="email" [formField]="coSpeaker.email" />
        </app-field>

        <app-field label="Bio">
          <textarea rows="4" [formField]="coSpeaker.bio"></textarea>
        </app-field>
      </fieldset>
    } @empty {
      <p class="empty">No co-speakers yet.</p>
    }
  </section>
</form>
